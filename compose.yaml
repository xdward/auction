services:
    nats:
        image: nats:latest
        command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
        networks:
            - isolated
        volumes:
            - nats_jetstream:/data

    expire-worker:
        build:
            context: .
            target: expire-worker
        image: auction-expire-worker:latest
        environment:
            NATS_ADDRESS: "nats:4222"
        depends_on:
            nats:
                condition: service_started
        networks:
            - isolated

    sell-worker:
        build:
            context: .
            target: sell-worker
        image: auction-sell-worker:latest
        environment:
            NATS_ADDRESS: "nats:4222"
        depends_on:
            nats:
                condition: service_started
            expire-worker:
                condition: service_started
        networks:
            - isolated

    grpc-server:
        build:
            context: .
            target: server
        image: auction-server:latest
        environment:
            NATS_ADDRESS: "nats:4222"
        depends_on:
            nats:
                condition: service_started
            expire-worker:
                condition: service_started
            sell-worker:
                condition: service_started
        networks:
            - isolated
            - public
        ports:
            - 50051:50051

volumes:
    nats_jetstream:

networks:
    isolated:
        internal: true
    public:
